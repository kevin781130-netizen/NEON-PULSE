name: Publish PR preview

on:
  push:
    branches:
      - feature/synesthetic-evolution
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-neon-pulse-preview
  cancel-in-progress: true

env:
  PUBLIC_REPOSITORY: kevin781130-netizen/GAME-TEST-LAB
  GAME_PATH: neon-pulse-preview
  DEPLOY_TOKEN: ${{ secrets.PUBLIC_PAGES_TOKEN }}

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v6

      - name: Check deploy secret
        id: secret
        shell: bash
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "PUBLIC_PAGES_TOKEN is not configured; preview publish skipped."
          fi

      - name: Checkout shared public game lab
        if: steps.secret.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.PUBLIC_REPOSITORY }}
          token: ${{ secrets.PUBLIC_PAGES_TOKEN }}
          path: public-site
          ref: main

      - name: Update preview folder
        if: steps.secret.outputs.configured == 'true'
        shell: bash
        run: |
          test -f index.html
          mkdir -p "public-site/$GAME_PATH"
          find "public-site/$GAME_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

          cp index.html "public-site/$GAME_PATH/index.html"

          shopt -s nullglob
          for file in *.mp3 *.wav *.ogg *.css *.js *.png *.jpg *.jpeg *.webp *.svg *.ico; do
            cp "$file" "public-site/$GAME_PATH/"
          done

          touch public-site/.nojekyll

      - name: Commit and push preview
        if: steps.secret.outputs.configured == 'true'
        shell: bash
        run: |
          cd public-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GAME_PATH" .nojekyll
          if git diff --cached --quiet; then
            echo "Preview build is already up to date."
          else
            git commit -m "Deploy $GAME_PATH from NEON-PULSE PR #1"
            git push origin main
          fi
